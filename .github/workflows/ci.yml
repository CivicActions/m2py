# CI — lint + test matrix (backend × split)
#
# Runs 17 parallel jobs:
#   - lint: ruff + ty
#   - test: 3 backends × 6 splits - 2 exclusions = 16 test jobs
#
# Backends: inmemory (parallel via xdist), yottadb (Docker), iris (Docker, custom image)
# Splits:   unit, functional-mvts, functional-other, slow, quality (inmemory only), munit

name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# ---------------------------------------------------------------------------
# Lint
# ---------------------------------------------------------------------------
jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync

      - name: Ruff lint
        run: uv run ruff check src/ tests/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/

      - name: ty type check
        # Exclude backend files with lazy-loaded SDK imports (iris/yottadb)
        # that produce unresolvable unresolved-attribute errors.
        # Everything else is checked at maximum strictness.
        run: >-
          uv run ty check --python-version 3.10
          --error-on-warning
          --exclude 'src/m2py/runtime/yottadb_backend.py'
          --exclude 'src/m2py/runtime/iris_backend.py'
          src/

  # -----------------------------------------------------------------------
  # Tests — backend × split matrix
  # -----------------------------------------------------------------------
  test:
    name: test (${{ matrix.backend }}, ${{ matrix.split }})
    runs-on: ${{ matrix.runner || 'ubuntu-latest' }}
    timeout-minutes: ${{ matrix.split == 'munit' && 120 || (matrix.split == 'slow' || matrix.split == 'quality') && 40 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        backend: [inmemory, yottadb, iris]
        split: [unit, functional-mvts, functional-other, slow, quality, munit]
        exclude:
          # quality tests are backend-independent — skip yottadb/iris
          - backend: yottadb
            split: quality
          - backend: iris
            split: quality
        include:
          # munit tests need more resources
          - backend: inmemory
            split: munit
            runner: ubicloud-standard-2
          - backend: yottadb
            split: munit
            runner: ubicloud-standard-2
          - backend: iris
            split: munit
            runner: ubicloud-standard-2

    env:
      # IRIS connection defaults (used only when backend=iris)
      IRIS_HOST: localhost
      IRIS_PORT: '1972'
      IRIS_NAMESPACE: USER
      IRIS_USER: _SYSTEM
      IRIS_PASSWORD: SYS

    steps:
      - uses: actions/checkout@v4

      # ── Python + uv (inmemory / iris — ydb runs inside Docker) ────
      - uses: actions/setup-python@v5
        if: matrix.backend != 'yottadb'
        with:
          python-version: '3.10'

      - uses: astral-sh/setup-uv@v4
        if: matrix.backend != 'yottadb'
        with:
          enable-cache: true

      - name: Install dependencies
        if: matrix.backend == 'inmemory'
        run: uv sync

      # ── VistA deps for munit split ────────────────────────────────
      - name: Cache VistA dependencies
        if: matrix.split == 'munit'
        uses: actions/cache@v4
        with:
          path: .vista-deps
          key: vista-deps-${{ hashFiles('tests/functional/munit/vista_versions.json') }}

      - name: Download VistA dependencies
        if: matrix.split == 'munit'
        run: python3 tests/functional/munit/setup_deps.py

      - name: Install dependencies (IRIS backend)
        if: matrix.backend == 'iris'
        run: uv sync --extra backend

      # ── YDB: build Docker image with layer caching ────────────────
      - uses: docker/setup-buildx-action@v3
        if: matrix.backend == 'yottadb'

      - name: Build YDB Docker image
        if: matrix.backend == 'yottadb'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.yottadb
          load: true
          tags: m2py-ydb
          cache-from: type=gha,scope=ydb-build
          cache-to: type=gha,mode=max,scope=ydb-build

      # ── IRIS: build custom image + start container ────────────────
      - uses: docker/setup-buildx-action@v3
        if: matrix.backend == 'iris'

      - name: Build IRIS Docker image
        if: matrix.backend == 'iris'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.iris
          load: true
          tags: m2py-iris-img
          cache-from: type=gha,scope=iris-build
          cache-to: type=gha,mode=max,scope=iris-build

      - name: Start IRIS container
        if: matrix.backend == 'iris'
        run: |
          docker run -d \
            --name m2py-iris \
            -p 1972:1972 \
            m2py-iris-img \
            --check-caps false

          # Wait for IRIS to be ready (up to 120s)
          echo -n "Waiting for IRIS"
          for i in $(seq 1 60); do
            if echo "H" | docker exec -i m2py-iris iris session IRIS -U USER >/dev/null 2>&1; then
              echo " ready ($((i * 2))s)."
              break
            fi
            echo -n "."
            sleep 2
          done

      # ── Run tests ─────────────────────────────────────────────────
      - name: Run tests
        env:
          M2PY_GLOBAL_BACKEND: ${{ matrix.backend }}
        run: |
          # Build pytest args as a bash array to handle quoting correctly
          ARGS=()
          case "${{ matrix.split }}" in
            unit)
              ARGS+=(tests/unit/ tests/integration/ tests/runtime/)
              ;;
            functional-mvts)
              ARGS+=(tests/functional/test_mvts.py)
              ;;
            functional-other)
              ARGS+=(tests/functional/ --ignore=tests/functional/test_mvts.py --ignore=tests/functional/munit/)
              ;;
            slow)
              ARGS+=(-m "slow and not quality and not munit")
              ;;
            quality)
              ARGS+=(-m quality)
              ;;
            munit)
              ARGS+=(tests/functional/munit/ -m munit)
              ;;
          esac
          ARGS+=(--ignore=tmp --tb=short -q)

          if [ "${{ matrix.backend }}" = "yottadb" ]; then
            docker run --rm -v "$PWD:/workspace" m2py-ydb \
              uv run pytest "${ARGS[@]}"
          else
            uv run pytest "${ARGS[@]}"
          fi

      # ── Cleanup ───────────────────────────────────────────────────
      - name: Stop IRIS container
        if: matrix.backend == 'iris' && always()
        run: docker rm -f m2py-iris || true
