# Pre-commit configuration for M2PY
# See https://pre-commit.com for more information
# See https://docs.astral.sh/ruff/integrations/#pre-commit for Ruff integration

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version - keep in sync with pyproject.toml if pinned there
    rev: v0.11.11
    hooks:
      # Run the linter with auto-fix
      - id: ruff
        args: [--fix]
      # Run the formatter
      - id: ruff-format

  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.407
    hooks:
      - id: pyright
        # Only check src/ directory (tests/utils excluded in pyrightconfig.json)
        files: ^src/
