[project]
name = "m2py"
version = "0.1.0"
description = "MUMPS to Python transpiler"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.3.1",
    "ruff>=0.15.0",
    "textX>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/m2py"]

[project.scripts]
m2py = "m2py.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.0",
]
backend = [
    "intersystems-irispython>=5.3.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.8.0",
    "ty>=0.0.20",
]
yottadb = [
    "yottadb>=2.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "pre1995: marks tests for pre-1995 MUMPS syntax backward compatibility",
    "parser: marks parser-level tests",
    "asg: marks ASG-level semantic tests",
    "codegen: marks code generation tests",
    "stub: marks stub tests pending implementation",
    "analysis: marks analysis module tests",
    "runtime: marks runtime module tests",
    "spec009: marks Spec 009 (LHS Functions & Global Variables) tests",
    "spec017: marks Spec 017 (YDB Test Suite Failure Resolution) tests",
    "integration: marks integration tests requiring full transpilation pipeline",
    "mugj: marks mugj (MUMPS User Group Japan) test suite tests",
    "basic: marks basic test suite tests",
    "mvts: marks mvts (M Validation Test Suite) tests",
    "merge: marks merge test suite tests",
    "functional: marks functional tests comparing against YDB outref",
    "backend: marks backend storage tests (run with M2PY_GLOBAL_BACKEND)",
    "backend_inmemory: marks tests requiring inmemory backend",
    "backend_yottadb: marks tests requiring yottadb backend",
    "backend_iris: marks tests requiring iris backend",
    "quality: marks backend-independent quality/perf tests (separate CI job)",
]
filterwarnings = [
    "error",
]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "E741"]
