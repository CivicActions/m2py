[project]
name = "m2py"
version = "0.1.0"
description = "MUMPS to Python transpiler"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textX>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pyright>=1.1.407",
]

[tool.pytest.ini_options]
addopts = "-n auto -m 'not slow'"
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
