[project]
name = "m2py"
version = "0.1.0"
description = "MUMPS to Python transpiler"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textX>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
]
